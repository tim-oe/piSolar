# piSolar Configuration
#
# Environment variable substitution using !ENV tag:
# Example: enabled: !ENV ${PISOLAR_TEMPERATURE_ENABLED:true}
#
# Logging is configured separately in logging.yaml

# Temperature sensor configuration (1-Wire sensors)
# address: sensor_id without family prefix (e.g. 0000007c6850 for DS18B20)
temperature:
  enabled: !ENV ${PISOLAR_TEMPERATURE_ENABLED:true}
  sensors:
    - name: "temp 1"
      address: "0000007b409e"
    - name: "temp 2"
      address: "000000b4c0d2"
    - name: "temp 3"
      address: "0000007c6850"
    - name: "temp 4"
      address: "0000007ba79d"
  schedule:
    # Cron expression: minute hour day month day_of_week
    cron: !ENV ${PISOLAR_TEMPERATURE_CRON:*/5 * * * *}  # Every 5 minutes
    enabled: !ENV ${PISOLAR_TEMPERATURE_SCHEDULE_ENABLED:true}

# Renogy BT-2 Bluetooth module configuration
renogy:
  enabled: !ENV ${PISOLAR_RENOGY_ENABLED:true}
  schedule:
    cron: !ENV ${PISOLAR_RENOGY_CRON:*/5 * * * *}  # Every 5 minutes
    enabled: !ENV ${PISOLAR_RENOGY_SCHEDULE_ENABLED:true}
  sensors:
    - name: !ENV ${PISOLAR_RENOGY_NAME_2:rover-40}
      read_type: !ENV ${PISOLAR_RENOGY_READ_TYPE_2:serial} 
      slave_address: !ENV ${PISOLAR_RENOGY_SLAVE_ADDR_2:16} # reover 40 defaulted to 16 the 20 to 1 the default
      device_path: !ENV ${PISOLAR_RENOGY_DEVICE_PATH_2:/dev/ttyUSB0}  # Serial port path
      scan_timeout: !ENV ${PISOLAR_RENOGY_SCAN_TIMEOUT_2:15.0}  # Timeout in seconds for BLE device scanning
      max_retries: !ENV ${PISOLAR_RENOGY_MAX_RETRIES_2:3}  # Number of retry attempts on failure
  
# MQTT broker configuration
mqtt:
  enabled: !ENV ${PISOLAR_MQTT_ENABLED:false}
  host: !ENV ${PISOLAR_MQTT_HOST:localhost}
  port: !ENV ${PISOLAR_MQTT_PORT:1883}
  client_id: !ENV ${PISOLAR_MQTT_CLIENT_ID:pisolar}
  username: !ENV ${PISOLAR_MQTT_USERNAME:}
  password: !ENV ${PISOLAR_MQTT_PASSWORD:}
  keepalive: !ENV ${PISOLAR_MQTT_KEEPALIVE:60}
  qos: !ENV ${PISOLAR_MQTT_QOS:1}
  retain: !ENV ${PISOLAR_MQTT_RETAIN:false}
  topics:
    solar: !ENV ${PISOLAR_MQTT_TOPIC_SOLAR:pisolar/solar}
    temperature: !ENV ${PISOLAR_MQTT_TOPIC_TEMPERATURE:pisolar/temperature}

# Metrics output configuration
metrics:
  output_dir: !ENV ${PISOLAR_METRICS_OUTPUT_DIR:/var/lib/pisolar/metrics}
