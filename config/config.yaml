# piSolar Configuration
#
# Environment variable substitution using !ENV tag:
# Example: enabled: !ENV ${PISOLAR_TEMPERATURE_ENABLED:true}
#
# Logging is configured separately in logging.yaml

# Temperature sensor configuration (1-Wire sensors)
# address: sensor_id without family prefix (e.g. 0000007c6850 for DS18B20)
temperature:
  enabled: !ENV ${PISOLAR_TEMPERATURE_ENABLED:true}
  sensors:
    - id: "1"
      address: "0000007b409e"
    - id: "2"
      address: "000000b4c0d2"
    - id: "3"
      address: "0000007c6850"
    - id: "4"
      address: "0000007ba79d"
  schedule:
    # Cron expression: minute hour day month day_of_week
    cron: !ENV ${PISOLAR_TEMPERATURE_CRON:*/5 * * * *}  # Every 5 minutes
    enabled: !ENV ${PISOLAR_TEMPERATURE_SCHEDULE_ENABLED:true}

# Renogy BT-2 Bluetooth module configuration
renogy:
  enabled: !ENV ${PISOLAR_RENOGY_ENABLED:true}
  schedule:
    cron: !ENV ${PISOLAR_RENOGY_CRON:*/5 * * * *}  # Every 5 minutes
    enabled: !ENV ${PISOLAR_RENOGY_SCHEDULE_ENABLED:true}
  sensors:
    - name: !ENV ${PISOLAR_RENOGY_NAME:rover-40}
      read_type: !ENV ${PISOLAR_RENOGY_READ_TYPE:serial}
      slave_address: !ENV ${PISOLAR_RENOGY_DEVICE_ADDR:16} # reover 40 defaulted to 16 the 20 to 1 the default
      device_path: !ENV ${PISOLAR_RENOGY_DEVICE_PATH:/dev/ttyACM0}  # Serial port path
      scan_timeout: !ENV ${PISOLAR_RENOGY_SCAN_TIMEOUT:15.0}  # Timeout in seconds for BLE device scanning
      max_retries: !ENV ${PISOLAR_RENOGY_MAX_RETRIES:3}  # Number of retry attempts on failure

# Metrics output configuration
metrics:
  output_dir: !ENV ${PISOLAR_METRICS_OUTPUT_DIR:/var/lib/pisolar/metrics}

# SQLite storage for persisting sensor readings as JSON
storage:
  enabled: !ENV ${PISOLAR_STORAGE_ENABLED:true}
  db_path: !ENV ${PISOLAR_STORAGE_DB_PATH:/var/lib/pisolar/readings.db}
  retention_days: !ENV ${PISOLAR_STORAGE_RETENTION_DAYS:30}
  prune_schedule:
    cron: !ENV ${PISOLAR_STORAGE_PRUNE_CRON:0 3 * * *}  # Daily at 3 AM
    enabled: !ENV ${PISOLAR_STORAGE_PRUNE_ENABLED:true}

# RabbitMQ publisher configuration
rabbitmq:
  enabled: !ENV ${PISOLAR_RABBITMQ_ENABLED:false}
  url: !ENV ${PISOLAR_RABBITMQ_URL:amqp://guest:guest@localhost:5672/}
  exchange: !ENV ${PISOLAR_RABBITMQ_EXCHANGE:pisolar}
  exchange_type: !ENV ${PISOLAR_RABBITMQ_EXCHANGE_TYPE:topic}
  routing_key: !ENV ${PISOLAR_RABBITMQ_ROUTING_KEY:sensor.reading}
  durable: !ENV ${PISOLAR_RABBITMQ_DURABLE:true}

# MySQL storage for persisting solar and temperature readings (SQLAlchemy)
mysql:
  enabled: !ENV ${PISOLAR_MYSQL_ENABLED:true}
  url: !ENV ${PISOLAR_MYSQL_URL:mariadb+mysqlconnector://pisolar:pisolar@localhost:3306/pisolar}
  pool_size: !ENV ${PISOLAR_MYSQL_POOL_SIZE:5}
  pool_recycle: !ENV ${PISOLAR_MYSQL_POOL_RECYCLE:3600}
